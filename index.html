<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Calculateur Pâtisserie</title>
<meta name="description" content="Calcule le coût de revient et le prix de vente de tes pâtisseries.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pâtisserie">
<meta name="theme-color" content="#F3EADF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1511" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
input,select,textarea{font-size:16px}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Nunito:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column phone app, bottom tab bar; the price breakdown is drawn as a café receipt. */
:root{
  --bg:#F3EADF;        /* lait d'avoine */
  --paper:#FFFAF3;     /* tasse */
  --ink:#36261C;       /* espresso */
  --muted:#85705F;     /* moka clair */
  --line:#E6D8C7;
  --accent:#5B3A28;    /* café */
  --accent-ink:#FFF7EE;
  --rose:#E9A9A0;      /* glaçage fraise */
  --rose-soft:#F8E1DC;
  --good:#5E8B5A;  --good-soft:#E3EEDD;   /* matcha */
  --warn:#B9782C;  --warn-soft:#F6E6CF;   /* caramel */
  --bad:#B4483E;   --bad-soft:#F7DCD7;    /* griotte */
  --shadow:0 1px 0 rgba(54,38,28,.05),0 6px 18px -10px rgba(54,38,28,.35);
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1511;--paper:#28201A;--ink:#F2E6D8;--muted:#B09A86;--line:#3E3128;
  --accent:#E3B48C;--accent-ink:#2A1C13;--rose:#D98D84;--rose-soft:#43292A;
  --good:#9BC593;--good-soft:#25352A;--warn:#E3AE68;--warn-soft:#3E2F1C;--bad:#EC8F84;--bad-soft:#45231F;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 20px -12px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1511;--paper:#28201A;--ink:#F2E6D8;--muted:#B09A86;--line:#3E3128;
  --accent:#E3B48C;--accent-ink:#2A1C13;--rose:#D98D84;--rose-soft:#43292A;
  --good:#9BC593;--good-soft:#25352A;--warn:#E3AE68;--warn-soft:#3E2F1C;--bad:#EC8F84;--bad-soft:#45231F;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 20px -12px rgba(0,0,0,.7);color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--rose);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:14px}

/* header */
.brand{display:flex;align-items:center;gap:10px;padding-top:6px}
.brand svg{width:34px;height:34px;flex:none}
.brand-name{font-family:var(--f-display);font-size:15px;color:var(--muted);letter-spacing:.01em}
h1{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1;margin:4px 0 0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:14px}
h2.sec{font-family:var(--f-display);font-weight:400;font-size:19px;margin:10px 2px -4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2.sec small{font-family:var(--f-body);font-size:14px;color:var(--muted);font-weight:700}

/* cards & fields */
.card{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.input,.field input,.field select,.field textarea{width:100%;min-width:0;background:var(--bg);border:1.5px solid transparent;border-radius:12px;padding:10px 12px;font-size:16px;transition:border-color .15s}
.input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--rose);outline:none}
.suffix{position:relative}
.suffix input{padding-right:44px}
.suffix i{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-weight:700;pointer-events:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1.1fr 1fr .9fr;gap:8px}
.hint{font-size:13px;color:var(--muted);margin:0}
textarea{resize:vertical;min-height:80px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 18px;font-weight:800;font-size:15px;background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad);box-shadow:none}
.btn.block{width:100%}
.btn:active{transform:translateY(1px)}
.btn svg{width:18px;height:18px}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:800;font-size:14px;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}

/* segmented */
.seg{display:flex;background:var(--paper);border-radius:999px;padding:4px;box-shadow:var(--shadow);gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:9px 10px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.inset{background:var(--bg);box-shadow:none}

/* search */
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search input{width:100%;border:0;border-radius:999px;background:var(--paper);box-shadow:var(--shadow);padding:12px 16px 12px 42px;font-size:16px}
.search input:focus{outline:2.5px solid var(--rose)}

/* recipe cards */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.rcard{width:100%;text-align:left;border:0;background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.rc-cat{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rc-name{font-family:var(--f-display);font-size:19px;line-height:1.2;display:block;overflow-wrap:anywhere}
.rc-meta{font-size:13px;color:var(--muted);display:block;margin-top:2px}
.rc-price{text-align:right;grid-row:1/span 2;grid-column:2}
.rc-price b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px}
.rc-price small{color:var(--muted);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;border-radius:999px;padding:3px 9px;background:var(--bg);color:var(--muted)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}

/* empty state */
.empty{text-align:center;padding:28px 18px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty svg{width:64px;height:64px;color:var(--rose)}
.empty b{font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--ink)}

/* ingredient rows (mercuriale) */
.irow{width:100%;text-align:left;border:0;background:transparent;display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.irow:last-child{border-bottom:0}
.irow b{font-weight:700;overflow-wrap:anywhere}
.irow small{color:var(--muted);font-size:13px}
.irow .ip{text-align:right;font-weight:800;grid-row:1/span 2;grid-column:2;align-self:center}
.irow .ip small{display:block;font-weight:600}
.card.flush{padding:2px 14px}

/* recipe detail */
.dhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.back{border:0;background:none;font-weight:800;color:var(--accent);display:inline-flex;align-items:center;gap:2px;padding:8px 4px 8px 0;font-size:15px}
.back svg{width:20px;height:20px}
.icon-btn{border:0;background:var(--paper);box-shadow:var(--shadow);width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}
.title-input{font-family:var(--f-display);font-size:28px;line-height:1.15;border:0;background:transparent;width:100%;padding:2px 0;border-bottom:2px dashed transparent}
.title-input:focus{outline:none;border-bottom-color:var(--rose)}

.line{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:12px 0;border-bottom:1px dashed var(--line)}
.line:first-child{padding-top:2px}
.lname{border:0;background:none;padding:0;text-align:left;font-weight:700;display:flex;align-items:center;gap:6px;min-width:0;overflow-wrap:anywhere}
.lname svg{width:14px;height:14px;color:var(--muted);flex:none}
.lname.unset{color:var(--muted);font-style:italic}
.lcost{font-weight:800;text-align:right}
.lctrl{grid-column:1/-1;display:flex;align-items:center;gap:8px}
.lctrl input{width:86px;background:var(--bg);border:1.5px solid transparent;border-radius:10px;padding:7px 10px;font-size:16px;text-align:right}
.lctrl input:focus{border-color:var(--rose);outline:none}
.lctrl select{background:var(--bg);border:0;border-radius:10px;padding:8px 6px;font-size:15px;font-weight:700}
.lctrl .pu{color:var(--muted);font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{border:0;background:none;color:var(--muted);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px}
.lwarn{grid-column:1/-1;font-size:13px;font-weight:700;color:var(--warn)}
.lwarn.bad{color:var(--bad)}
.addline{border:0;background:none;width:100%;padding:12px 0 4px;text-align:left;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:6px}
.addline svg{width:18px;height:18px}

.trow{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.trow:last-child{border-bottom:0}
.trow small{display:block;color:var(--muted);font-size:13px}
.hm{grid-column:1/-1;display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:700}
.hm input{width:64px;background:var(--bg);border:1.5px solid transparent;border-radius:10px;padding:7px 10px;font-size:16px;text-align:right;color:var(--ink)}
.hm input:focus{border-color:var(--rose);outline:none}

.banner{border-radius:14px;padding:10px 12px;font-size:14px;font-weight:700;display:flex;gap:8px;align-items:flex-start}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.info{background:var(--paper);color:var(--muted);box-shadow:var(--shadow)}

/* receipt */
.receipt{position:relative;background:var(--paper);border-radius:14px 14px 0 0;padding:20px 18px 18px;font-family:var(--f-mono);font-size:14px;box-shadow:var(--shadow);margin-bottom:12px}
.receipt::after{content:"";position:absolute;left:0;right:0;top:100%;height:10px;
  background:linear-gradient(-45deg,transparent 7px,var(--paper) 0) 0 0/14px 10px repeat-x,linear-gradient(45deg,transparent 7px,var(--paper) 0) 0 0/14px 10px repeat-x}
.r-head{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase;line-height:1.6;margin-bottom:12px}
.r-head b{display:block;font-family:var(--f-display);text-transform:none;letter-spacing:0;font-weight:400;font-size:20px;color:var(--ink)}
.r-line{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.r-line span:first-child{min-width:0}
.r-line span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.r-line.sub{color:var(--muted);font-size:13px;padding-left:12px}
.r-line.strong{font-weight:500;font-size:15px}
.r-sep{border-top:1.5px dashed var(--line);margin:10px 0}
.r-total{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-top:2px}
.r-total span{text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.r-total b{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1}
.r-foot{text-align:center;color:var(--muted);margin-top:12px;font-size:13px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile span{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile b{font-family:var(--f-display);font-weight:400;font-size:24px}
.tile small{font-size:12.5px;color:var(--muted)}
.tile.good b{color:var(--good)} .tile.warn b{color:var(--warn)} .tile.bad b{color:var(--bad)}

.verdict{border-radius:14px;padding:12px 14px;margin-top:12px;font-weight:700;font-size:15px}
.verdict b{font-family:var(--f-display);font-weight:400;font-size:22px;display:block}
.verdict small{display:block;font-weight:600;font-size:13px;margin-top:2px;opacity:.9}
.verdict.good{background:var(--good-soft);color:var(--good)}
.verdict.warn{background:var(--warn-soft);color:var(--warn)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict.none{background:var(--bg);color:var(--muted)}

/* bottom bars */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);box-shadow:0 -1px 0 var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabbar-in{max-width:560px;margin:0 auto;display:flex;justify-content:space-around}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;color:var(--muted);padding:6px 14px;border-radius:14px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] svg{fill:var(--rose-soft)}

.sumbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--accent);color:var(--accent-ink);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sumbar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:14px}
.sumbar .s{display:flex;flex-direction:column;line-height:1.15}
.sumbar .s span{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;opacity:.75}
.sumbar .s b{font-family:var(--f-display);font-weight:400;font-size:20px}
.sumbar button{margin-left:auto;border:0;border-radius:999px;background:var(--accent-ink);color:var(--accent);font-weight:800;padding:10px 14px;font-size:14px}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(30,20,14,.45);animation:fade .18s ease}
.sheet{position:relative;width:100%;max-width:560px;max-height:88%;overflow:auto;background:var(--paper);border-radius:22px 22px 0 0;padding:8px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 0}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0}
.sheet .field input,.sheet .field select,.sheet .field textarea{background:var(--bg)}
.sheet-actions{display:flex;gap:10px}
.sheet-actions .btn{flex:1}
.calc-out{background:var(--bg);border-radius:12px;padding:10px 12px;font-weight:800;display:flex;justify-content:space-between;gap:8px}
.calc-out span{color:var(--muted);font-weight:700}
.pick-list{list-style:none;margin:0;padding:0}
.pick-list button{width:100%;text-align:left;border:0;background:none;padding:12px 4px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.pick-list button small{color:var(--muted)}
.pick-list .create{color:var(--accent);font-weight:800}
.menu-list{display:flex;flex-direction:column;gap:8px}
.hist{font-size:13px;color:var(--muted);margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.mono{font-family:var(--f-mono);font-size:12.5px;width:100%;min-height:120px;background:var(--bg);border:0;border-radius:12px;padding:10px}

.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:60;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;padding:10px 16px;border-radius:999px;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.status{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot.good{background:var(--good)} .dot.warn{background:var(--warn)}
details.how summary{cursor:pointer;font-weight:800}
details.how p{color:var(--muted);font-size:14px;margin:8px 0 0}

/* prices use the rounded body face: the display serif has old-style figures */
.rc-price b,.r-total b,.tile b,.sumbar .s b,.verdict b{font-family:var(--f-body);font-weight:800;letter-spacing:-.01em}
/* ingredient illustrations */
:root{--ic-line:#4A3326;--ic-bg:#F5EADD;--f-cream:#FFF3E0;--f-butter:#F4D77E;--f-choco:#8B5A3C;--f-berry:#E77F89;--f-citrus:#F3CF56;--f-orange:#F1A55B;--f-leaf:#A8C88C;--f-nut:#D7A574;--f-pink:#F6D0CA;--f-plum:#93608B;--f-blue:#A9C6DC}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ic-line:#EADBC8;--ic-bg:#362A22;--f-cream:#5C4B3E;--f-butter:#B8984A;--f-choco:#7A4E33;--f-berry:#C9636E;--f-citrus:#C8A53D;--f-orange:#C7844A;--f-leaf:#6F915F;--f-nut:#9E7550;--f-pink:#7E5552;--f-plum:#7A4E74;--f-blue:#5E7F96}}
:root[data-theme="dark"]{--ic-line:#EADBC8;--ic-bg:#362A22;--f-cream:#5C4B3E;--f-butter:#B8984A;--f-choco:#7A4E33;--f-berry:#C9636E;--f-citrus:#C8A53D;--f-orange:#C7844A;--f-leaf:#6F915F;--f-nut:#9E7550;--f-pink:#7E5552;--f-plum:#7A4E74;--f-blue:#5E7F96}
.ic{width:42px;height:42px;border-radius:13px;background:var(--ic-bg);display:grid;place-items:center;flex:none}
.ic svg{width:31px;height:31px;overflow:visible}
.ic.sm{width:34px;height:34px;border-radius:11px}.ic.sm svg{width:26px;height:26px}
.ic.xs{width:26px;height:26px;border-radius:8px}.ic.xs svg{width:20px;height:20px}
.card .ic,.sheet .ic{background:var(--ic-bg)}
.rc-ics{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;align-items:center}
.rc-more{font-size:12px;font-weight:800;color:var(--muted);padding-left:2px}
.irow{grid-template-columns:42px 1fr auto;column-gap:12px;align-items:center}

.cat .ic{background:var(--paper);border-radius:50%}
.cat[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pk-scroll{position:relative;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:0 -6px;padding:0 6px calc(96px + env(safe-area-inset-bottom,0px))}

.pk-row{width:100%;display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;border:0;background:none;text-align:left;padding:7px 6px;border-radius:14px;transition:background .12s}
.pk-row:active{background:var(--bg)}
.pk-txt{min-width:0}
.pk-txt b{display:block;font-weight:700;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.pk-txt small{display:block;color:var(--muted);font-size:13px}
.warnc{color:var(--warn);font-weight:700}
.tick{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;color:transparent;transition:background .12s}
.tick svg{width:16px;height:16px}
.tick.edit,.tick.plus{box-shadow:none;color:var(--muted)}
.pk-row[aria-pressed="true"]{background:var(--rose-soft)}
.pk-row[aria-pressed="true"] .ic{background:var(--paper)}
.pk-row[aria-pressed="true"] .tick{background:var(--accent);box-shadow:none;color:var(--accent-ink)}

.pk-foot .btn{animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){.grid3{grid-template-columns:1fr 1fr}.grid3 .field:last-child{grid-column:1/-1}}

})();

/* ---------- maths ---------- */
function unitPrice(ing){ // € per base unit (g, ml or pce)
  if(!ing)return null;
  const p=num(ing.price),q=num(ing.qty),u=UNITS[ing.unit];
  if(p==null||!(q>0)||!u)return null;
  return p/(q*u.f);
}
function baseOf(ing){return UNITS[ing&&ing.unit]?UNITS[ing.unit].base:"g"}
function defaultUnit(ing){const b=baseOf(ing);return b==="g"?"g":b==="ml"?"ml":"pce"}
function toBase(q,unit,ing){
  const lu=UNITS[unit]||UNITS[defaultUnit(ing)],iu=UNITS[ing.unit]||UNITS.g;
  const v=q*lu.f;
  if(lu.base===iu.base)return{v};
  if(lu.base!=="pce"&&iu.base!=="pce")return{v,approx:true};
  const gp=num(ing.gPerPiece);
  if(gp>0)return lu.base==="pce"?{v:v*gp,approx:true}:{v:v/gp,approx:true};
  return{err:"unit"};
}
function lineCost(line){
  const ing=S.ings[line.ingId];
  if(!line.ingId)return{cost:0,err:"choose"};
  if(!ing)return{cost:0,err:"gone"};
  const q=num(line.qty);
  if(q==null||q===0)return{cost:0,err:"qty"};
  const pu=unitPrice(ing);
  if(pu==null)return{cost:0,err:"price"};
  const c=toBase(q,line.unit,ing);
  if(c.err)return{cost:0,err:c.err};
  return{cost:c.v*pu,approx:c.approx};
}
function packCost(line){
  const ing=S.ings[line.ingId];
  if(!line.ingId)return{cost:0,err:"choose"};
  if(!ing)return{cost:0,err:"gone"};
  const q=num(line.qty);if(q==null||q===0)return{cost:0,err:"qty"};
  const p=num(ing.price),pq=num(ing.qty);
  if(p==null||!(pq>0))return{cost:0,err:"price"};
  // fournitures: price per piece of the pack, whatever the unit label
  const per=UNITS[ing.unit]&&UNITS[ing.unit].base==="pce"?p/pq:unitPrice(ing);
  return{cost:q*per};
}
function roundUp(v,step){if(!(step>0))return v;return Math.ceil(v/step-1e-9)*step}
function compute(r){
  const st=S.settings;
  let mat=0,issues=0,missingPrice=0;
  const lines={};
  (r.lines||[]).forEach(l=>{const c=lineCost(l);lines[l.id]=c;mat+=c.cost;if(c.err&&c.err!=="qty")issues++;if(c.err==="price")missingPrice++;});
  let pack=0;
  (r.pack||[]).forEach(l=>{const c=packCost(l);lines[l.id]=c;pack+=c.cost;if(c.err&&c.err!=="qty")issues++;if(c.err==="price")missingPrice++;});
  const loss=mat*(num(st.lossPct)||0)/100;
  const laborH=(num(r.laborMin)||0)/60;
  const labor=laborH*(num(st.hourlyRate)||0);
  const oven=(num(r.ovenMin)||0)/60*(num(st.ovenRate)||0);
  const fixed=r.noFixed?0:(num(st.fixedCost)||0);
  const cost=mat+loss+pack+labor+oven+fixed;
  const ch=Math.min(Math.max((num(st.chargesPct)||0)/100,0),.9);
  const mode=(r.pricing&&r.pricing.mode)||"profit";
  const val=num(r.pricing&&r.pricing.value)||0;
  const target=mode==="profit"?cost+val:cost*(1+val/100);
  const raw=target/(1-ch);
  const price=roundUp(raw,num(st.rounding)||0);
  const charges=price*ch;
  const net=price*(1-ch)-cost;
  const portions=num(r.portions)||0;
  const foodPct=price>0?(mat+loss+pack)/price:null;
  const hourly=laborH>0?(price*(1-ch)-(cost-labor))/laborH:null;
  const fp=num(r.friendPrice);
  let friend=null;
  if(fp!=null){
    const keep=fp*(1-ch);
    friend={fp,net:keep-cost,outOfPocket:keep-(cost-labor),hourly:laborH>0?(keep-(cost-labor))/laborH:null};
  }
  return{mat,loss,pack,labor,laborH,oven,fixed,cost,ch,charges,mode,val,target,raw,price,round:price-raw,net,portions,perPart:portions>0?price/portions:null,costPart:portions>0?cost/portions:null,foodPct,hourly,friend,lines,issues,missingPrice,noLabor:!(laborH>0)};
}

/* ---------- persistence ---------- */
const wq={};
function setDoc(path,data){
  if(S.mode!=="db"){saveLocal();return}
  const q=wq[path]||(wq[path]={busy:false,next:undefined});
  q.next=data;
  if(!q.busy)flush(path);
}
async function flush(path){
  const q=wq[path];q.busy=true;
  while(q.next!==undefined){
    const d=q.next;q.next=undefined;
    for(let attempt=0;attempt<2;attempt++){
      try{d===null?await db.doc(path).delete():await db.doc(path).set(d);break}
      catch(e){
        const code=e&&e.code;
        if(code==="unavailable"&&attempt===0){await sleep(600+Math.random()*900);continue}
        if(code==="invalid_argument"&&!S.readonly){S.readonly=true;toast("Modification refusée : tu n'as que l'accès lecture.");render()}
        else if(code==="quota_exceeded")toast("Stockage plein : supprime quelques éléments.");
        else if(code!=="invalid_argument")toast("Enregistrement impossible pour l'instant. Réessaie dans un moment.");
        break;
      }
    }
  }
  q.busy=false;
}
function isWriting(path){const q=wq[path];return q&&(q.busy||q.next!==undefined)}
function saveLocal(){
  if(S.mode==="local")lsSet(LOCAL_KEY,{ings:S.ings,recipes:S.recipes,settings:S.settings});

(async function connect(){
  const C=window.claude;
  let dbNs=null,user=null;
  try{dbNs=C&&C.use?await C.use("db"):null}catch(e){dbNs=null}
  if(!dbNs){
    S.mode="local";
    const loc=lsGet(LOCAL_KEY);
    if(loc)applyData(loc);else if(window.PATIS_STARTER){applyData(window.PATIS_STARTER);saveLocal()}else applyData({});
    render();return;
  }
  db=dbNs;S.mode="db";
  try{user=C.use?await C.use("user"):null}catch(e){user=null}
  if(user){try{const w=await user.can("data.write");if(w===false)S.readonly=true}catch(e){}}
  const got={i:false,r:false,s:false};
  const slowT=setTimeout(()=>{if(!(got.i&&got.r)){S.slow=true;render()}},10000);
  const done=()=>{if(got.i&&got.r){clearTimeout(slowT);if(S.slow){S.slow=false}}};
  const onErr=e=>{clearTimeout(slowT);if(e&&e.code==="revoked"){S.readonly=true}toast("Connexion à tes données perdue. Recharge la page.");render()};
  db.collection("ingredients").onSnapshot(snap=>{
    const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});
    S.ings=o;if(!snap.metadata.fromCache)got.i=true;done();saveCache();refresh();
  },onErr);
  db.collection("recipes").onSnapshot(snap=>{
    const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});
    S.recipes=o;if(!snap.metadata.fromCache)got.r=true;done();saveCache();
    if(S.view==="recipe"&&S.openId){
      const inc=o[S.openId];
      if(!inc){if(!draftTimer&&!isWriting("recipes/"+S.openId)){S.draft=null;S.view="recipes";S.openId=null}}
      else if(!draftTimer&&!isWriting("recipes/"+S.openId)&&JSON.stringify(inc)!==JSON.stringify(S.draft)){S.draft=clone(inc);needFull=true}
    }
    refresh();
  },onErr);
  db.doc("settings/main").onSnapshot(snap=>{
    if(snap.exists&&!setTimer){S.settings={...DEFAULTS,...snap.data()}}
    got.s=true;saveCache();refresh();
  },onErr);
  render();
})();

let needFull=false;
function refresh(){
  // Avoid wiping an input the user is typing in.
  const a=document.activeElement;
  const typing=a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")&&a.closest("#main,#sheetBody");
  if(typing&&!needFull){if(S.view==="recipe")updateComputed();return}
  if(typing){pendingRender=true;updateComputed();return}
  needFull=false;render();
}

document.addEventListener("focusout",()=>{setTimeout(()=>{if(pendingRender){const a=document.activeElement;if(!(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"))){pendingRender=false;needFull=false;render()}}},50)});

/* recipes list */
function sortedRecipes(){
  const q=norm(S.q);
  return Object.entries(S.recipes).filter(([id,r])=>!q||norm(r.name).includes(q)||norm(r.category).includes(q))
    .sort((a,b)=>String(b[1].updatedAt||"").localeCompare(String(a[1].updatedAt||"")));
}
function viewRecipes(){
  const n=Object.keys(S.recipes).length;
  return `<section class="view">
    ${brand()}
    <div><h1>Mes recettes</h1><p class="sub">${n?`${n} création${n>1?"s":""} · ton temps compté à ${moneyR(num(S.settings.hourlyRate)||0)}/h`:"Calcule le vrai prix de chaque gâteau."}</p></div>
    ${statusBanner()}
    ${n>3?`<div class="search">${I.search}<input id="q" type="search" placeholder="Chercher une recette" value="${esc(S.q)}" autocomplete="off"></div>`:""}
    <button class="btn primary block" data-act="new-recipe" id="btn-new-recipe">${I.plus} Nouvelle recette</button>
    <ul class="list" id="recipeList">${recipeItems()}</ul>
  </section>`;
}
function recipeItems(){
  const rows=sortedRecipes();
  if(!rows.length){
    if(S.mode==="loading")return `<li class="empty">${I.cake}<b>On sort les recettes du four…</b></li>`;
    if(S.q)return `<li class="empty"><b>Aucune recette trouvée</b><span>Essaie un autre mot.</span></li>`;
    return `<li class="empty">${I.cake}<b>Pas encore de recette</b><span>Ajoute d'abord tes ingrédients avec leur prix d'achat, puis crée ta première recette.</span></li>`;
  }
  return rows.map(([id,r])=>{
    const c=compute(r);
    const chips=[];
    if(c.issues)chips.push(`<span class="chip warn">${c.issues} à vérifier</span>`);
    if(c.noLabor)chips.push(`<span class="chip warn">temps non compté</span>`);
    if(c.friend){chips.push(c.friend.net>=0?`<span class="chip good">prix ami ${moneyR(c.friend.fp)} ok</span>`:`<span class="chip ${c.friend.outOfPocket<0?"bad":"warn"}">prix ami ${moneyR(c.friend.fp)}</span>`)}
    return `<li><button class="rcard" data-act="open" data-id="${esc(id)}">
      <span><span class="rc-cat">${esc(r.category||"Sans catégorie")}${c.portions?` · ${fnum(c.portions)} parts`:""}</span>
      <span class="rc-name">${esc(r.name||"Sans nom")}</span>
      <span class="rc-meta num">Coût ${money(c.cost)} · bénéfice ${money(c.net)}</span>
      ${chips.length?`<span class="chips">${chips.join("")}</span>`:""}${rcIcons(r)}</span>
      <span class="rc-price num"><b>${moneyR(c.price)}</b>${c.perPart?`<small>${money(c.perPart)} la part</small>`:""}</span>
    </button></li>`;
  }).join("");
}

/* ingredients list */
function priceLabel(ing){
  const pu=unitPrice(ing);if(pu==null)return null;
  const b=baseOf(ing);
  if(ing.kind==="fourniture"&&b==="pce")return money(pu)+" / pièce";
  if(b==="g")return money(pu*1000)+" / kg";
  if(b==="ml")return money(pu*1000)+" / L";
  return money(pu)+" / pièce";
}
function trend(ing){
  const h=ing.history;if(!h||!h.length)return "";
  const last=h[h.length-1].pu,pu=unitPrice(ing);
  if(!(last>0)||pu==null)return "";
  const d=(pu-last)/last;
  if(Math.abs(d)<0.005)return "";
  return `<span class="chip ${d>0?"warn":"good"}">${d>0?"↑":"↓"} ${nf1.format(Math.abs(d*100))} %</span>`;
}
function usage(ingId){return Object.values(S.recipes).filter(r=>(r.lines||[]).some(l=>l.ingId===ingId)||(r.pack||[]).some(l=>l.ingId===ingId)).length}
function viewIngs(){
  const kind=S.ingKind;
  const all=Object.values(S.ings);
  const nI=all.filter(i=>(i.kind||"ingredient")==="ingredient").length,nF=all.filter(i=>i.kind==="fourniture").length;
  const todo=all.filter(i=>(i.kind||"ingredient")===kind&&unitPrice(i)==null).length;
  if(!todo)S.ingTodo=false;

function rcIcons(r){

function receiptHtml(r,c){

    ${c.loss?L(`Pertes ${fnum(num(st.lossPct))} %`,money(c.loss),"sub"):""}
    ${L("Emballages",money(c.pack))}
    ${L(`Ton temps ${c.laborH?fmtMin(c.laborH*60):"(non saisi)"}`,money(c.labor))}
    ${c.laborH?L(`à ${moneyR(num(st.hourlyRate)||0)}/h`,"","sub"):""}
    ${L("Four",money(c.oven))}
    ${L("Eau & nettoyage",money(c.fixed))}
    <div class="r-sep"></div>
    ${L("Coût de revient",money(c.cost),"strong")}

function tilesHtml(c){
  const fp=c.foodPct;
  const fcls=fp==null?"":fp<=.35?"good":fp<=.5?"warn":"bad";
  const rate=num(S.settings.hourlyRate)||0;
  const h=c.hourly;
  return `<div class="tile ${fcls}"><span>Part matière</span><b>${fp==null?"—":nf1.format(fp*100)+" %"}</b><small>du prix. En pâtisserie on vise 25 à 35 %.</small></div>
    <div class="tile ${h==null?"":h>=rate?"good":h>0?"warn":"bad"}"><span>Ton heure payée</span><b>${h==null?"—":moneyR(h)}</b><small>${h==null?"Saisis ton temps de travail.":"en comptant le bénéfice."}</small></div>`;
}
function verdictHtml(c){
  const f=c.friend;
  if(!f)return `<div class="verdict none">Tape un prix pour voir ce qu'il te rapporte vraiment.</div>`;
  const rate=num(S.settings.hourlyRate)||0;
  if(f.net>=0)return `<div class="verdict good"><b>+${money(f.net)} de bénéfice</b>Tout est couvert, ton temps est payé ${moneyR(rate)}/h.<small>${moneyR(c.price-f.fp)} de moins que le prix conseillé.</small></div>`;
  if(f.outOfPocket>=0)return `<div class="verdict warn"><b>Ton heure payée ${f.hourly!=null?moneyR(f.hourly):"—"}</b>Les ingrédients et frais sont couverts, mais ton temps est payé moins que tes ${moneyR(rate)}/h.<small>Il manque ${money(-f.net)} pour atteindre ton tarif.</small></div>`;
  return `<div class="verdict bad"><b>Tu perds ${money(-f.outOfPocket)}</b>Ce prix ne couvre même pas les ingrédients et les frais.<small>Minimum sans payer ton temps : ${money((c.cost-c.labor)/(1-c.ch))}.</small></div>`;
}
function updateComputed(){
  if(S.view!=="recipe"||!S.draft)return;
  const r=S.draft,c=compute(r);
  const set=(k,h)=>{const el=document.querySelector(`[data-out="${k}"]`);if(el)el.innerHTML=h};
  Object.entries(c.lines).forEach(([id,lc])=>{
    set("cost-"+id,lc.err?"—":(lc.approx?"≈ ":"")+money(lc.cost));
    const w=document.querySelector(`[data-out="warn-${id}"]`);
    if(w){
      const ln=r.lines.concat(r.pack).find(x=>x.id===id);
      const msg=lc.err&&lc.err!=="qty"?ERR[lc.err]:(lc.approx?"Conversion approximative (1 ml ≈ 1 g, ou poids d'une pièce)":"");
      const fix=ln&&ln.ingId&&(lc.err==="price"||lc.err==="unit")?`<button class="fix" data-act="fix-price" data-id="${esc(ln.ingId)}">${lc.err==="price"?"Ajouter le prix":"Corriger"}</button>`:"";
      w.innerHTML=esc(msg)+fix;w.hidden=!msg;w.className="lwarn"+(lc.err==="unit"||lc.err==="gone"?" bad":"")}
  });
  set("mat",money(c.mat));
  set("loss",c.loss?`+ ${money(c.loss)} de pertes (${fnum(num(S.settings.lossPct))} %, réglable dans Réglages)`:"");
  set("pack",money(c.pack));
  set("labor",money(c.labor));
  set("oven",money(c.oven));
  set("time",money(c.labor+c.oven));
  set("labor-warn",c.noLabor?`<div class="banner warn">Ton temps de travail n'est pas saisi : le prix ne paie pas les heures passées en cuisine.</div>`:"");
  const rc=$("#receipt");if(rc)rc.innerHTML=receiptHtml(r,c);
  const t=$("#tiles");if(t)t.innerHTML=tilesHtml(c);
  const v=$("#verdict");if(v)v.innerHTML=verdictHtml(c);
  $("#sumbar").innerHTML=`<div class="sumbar-in">
    <div class="s"><span>Coût</span><b class="num">${money(c.cost)}</b></div>
    <div class="s"><span>Prix conseillé</span><b class="num">${moneyR(c.price)}</b></div>
    ${S.tab==="compo"?`<button data-act="tab" data-tab="prix">Voir le ticket</button>`:`<button data-act="tab" data-tab="compo">Composition</button>`}
  </div>`;
}

  o.innerHTML=pl?`<span>Revient à</span>${esc(pl)}`:`<span>Revient à</span>— (prix et quantité nécessaires)`;
  const g=$("#gpp-wrap");if(g)g.hidden=f.kind==="fourniture";
  const ic=$("#ing-ic use");if(ic)ic.setAttribute("href","#ic-"+(sheetCtx.icon&&ICONS[sheetCtx.icon]?sheetCtx.icon:guessIcon(f.name,f.kind)));
}
function saveIng(){
  const c=sheetCtx,f=readIngForm();
  if(!f.name){toast("Donne un nom à l'ingrédient.");$("#ing-name").focus();return}
  const id=c.id||uid();
  const old=c.id?S.ings[c.id]:null;
  const data={...(old?clone(old):{}),...f,updatedAt:new Date().toISOString()};
  if(data.price==null)data.price=null;
  const oldPu=old?unitPrice(old):null,newPu=unitPrice(data);
  if(old&&oldPu!=null&&newPu!=null&&Math.abs(oldPu-newPu)>1e-9){
    data.history=[...(old.history||[]),{d:old.updatedAt||today(),pu:oldPu}].slice(-12);
  }
  putIng(id,data);
  const after=c.after;
  closeSheet();
  toast(c.id?"Ingrédient enregistré":"Ajouté à ta liste");
  if(after)after(id);
  render();
}

function pickSheet(o){
  const kind=o.kind;
  const cats=CATS.filter(c=>c.kind===kind);
  const total=CATALOG.filter(c=>c.kind===kind).length;
  const title=o.mode==="replace"?(kind==="fourniture"?"Changer l'emballage":"Changer l'ingrédient"):(kind==="fourniture"?"Ajouter des emballages":"Ajouter des ingrédients");
  openSheet(`<div class="pk-head">
      <div class="pk-title"><h2>${title}</h2><button class="x" data-act="close-sheet" aria-label="Fermer">${I.x}</button></div>
      <div class="search">${I.search}<input id="pick-q" type="search" placeholder="Chercher parmi ${total}+ ${kind==="fourniture"?"emballages":"ingrédients"}" autocomplete="off" enterkeyhint="search"></div>
      <div class="cats" id="pk-cats">
        <button class="cat" data-act="pk-cat" data-sec="mine" aria-pressed="true">${icon("heart","xs")}Ma liste</button>
        ${cats.map(c=>`<button class="cat" data-act="pk-cat" data-sec="${c.id}" aria-pressed="false">${icon(c.icon,"xs")}${esc(c.label)}</button>`).join("")}
      </div>
    </div>
    <div class="pk-scroll" id="pk-scroll"></div>
    ${o.mode!=="replace"?`<div class="pk-foot" id="pk-foot" hidden><button class="btn primary block" data-act="pk-add" id="pk-add"></button></div>`:""}`,
    {type:"pick",mode:o.mode,kind,lineId:o.lineId,sel:new Set()});
  $("#sheetBody").classList.add("tall");
  $("#pk-scroll").addEventListener("scroll",pickSpy,{passive:true});
  renderPick();
}
function ownedMatch(c){
  const n=norm(c.name);
  for(const [id,i] of Object.entries(S.ings)){if(i.catalogId===c.id||norm(i.name)===n)return id}
  return null;
}
function renderPick(){
  const c=sheetCtx;if(!c||c.type!=="pick")return;
  const raw=$("#pick-q").value.trim(),nq=norm(raw);
  const match=s=>!nq||norm(s).includes(nq);
  const kind=c.kind;
  const inRecipe=new Set(c.mode!=="ings"&&S.draft?(kind==="fourniture"?S.draft.pack:S.draft.lines).map(l=>l.ingId):[]);
  const right=c.mode==="replace"?"":`<span class="tick">${I.check}</span>`;
  const row=(key,ic,name,sub)=>`<button class="pk-row" data-act="pk-tap" data-key="${esc(key)}" aria-pressed="${c.sel.has(key)}">${icon(ic)}<span class="pk-txt"><b>${esc(name)}</b><small>${sub}</small></span>${right}</button>`;
  let html="",found=0;
  const mine=Object.entries(S.ings).filter(([id,i])=>(i.kind||"ingredient")===kind&&match(i.name)).sort((a,b)=>a[1].name.localeCompare(b[1].name,"fr"));
  found+=mine.length;
  if(mine.length||!nq){
    html+=`<section class="pk-sec" id="pks-mine" data-sec="mine"><h3>Ma liste <small>${mine.length}</small></h3>${mine.length?mine.map(([id,i])=>{
      const pl=priceLabel(i);
      const sub=(inRecipe.has(id)?"déjà dans la recette · ":"")+(pl?esc(pl):`<span class="warnc">prix à ajouter</span>`);
      const r=row("i:"+id,iconOf(i),i.name,sub);
      return c.mode==="ings"?r.replace(`<span class="tick">${I.check}</span>`,`<span class="tick edit">${I.edit}</span>`):r;
    }).join(""):`<p class="hint pk-empty">Ce que tu choisis ci-dessous arrive ici, avec ton prix d'achat.</p>`}</section>`;
  }
  CATS.filter(x=>x.kind===kind).forEach(cat=>{
    const items=CATALOG.filter(x=>x.cat===cat.id&&match(x.name)&&!ownedMatch(x));
    found+=items.length;
    if(items.length)html+=`<section class="pk-sec" id="pks-${cat.id}" data-sec="${cat.id}"><h3>${esc(cat.label)} <small>${items.length}</small></h3>${items.map(x=>row("c:"+x.id,x.icon,x.name,`${fnum(x.qty)} ${x.unit==="pce"?(x.qty>1?"pièces":"pièce"):x.unit} · prix à ajouter`)).join("")}</section>`;
  });
  if(!found)html+=`<div class="empty"><b>Rien pour « ${esc(raw)} »</b><span>Crée-le, il sera rangé dans ta liste.</span></div>`;
  html+=`<section class="pk-sec"><button class="pk-row create" data-act="pk-create">${icon(raw?guessIcon(raw,kind):"bowl")}<span class="pk-txt"><b>${raw?`Créer « ${esc(raw)} »`:"Créer un ingrédient perso"}</b><small>Pour ce qui n'est pas dans la liste</small></span><span class="tick plus">${I.plus}</span></button></section>`;
  $("#pk-scroll").innerHTML=html;
  $("#pk-cats").hidden=!!nq;
  updPickFoot();
  if(!nq)pickSpy();
}
function updPickFoot(){
  const c=sheetCtx,f=$("#pk-foot");if(!f)return;
  const n=c.sel.size;f.hidden=!n;
  if(n)$("#pk-add").textContent=`Ajouter ${n} ${c.kind==="fourniture"?(n>1?"emballages":"emballage"):(n>1?"ingrédients":"ingrédient")}`;
}
function pickSpy(){
  const sc=$("#pk-scroll"),cats=$("#pk-cats");if(!sc||!cats)return;
  const secs=sc.querySelectorAll(".pk-sec[data-sec]");if(!secs.length)return;
  let cur=secs[0].dataset.sec;
  secs.forEach(s=>{if(s.offsetTop<=sc.scrollTop+12)cur=s.dataset.sec});
  if(sc.scrollTop+sc.clientHeight>=sc.scrollHeight-4)cur=secs[secs.length-1].dataset.sec;
  cats.querySelectorAll(".cat").forEach(b=>{
    const on=b.dataset.sec===cur;
    if(on!==(b.getAttribute("aria-pressed")==="true")){
      b.setAttribute("aria-pressed",on);
      if(on)cats.scrollTo({left:b.offsetLeft-cats.clientWidth/2+b.offsetWidth/2,behavior:reduceMotion?"auto":"smooth"});
    }
  });
}
const reduceMotion=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function createFromCatalog(c){
  const existing=ownedMatch(c);if(existing)return existing;
  let id=slugify(c.name)||uid();if(S.ings[id])id+="-"+uid().slice(-4);
  putIng(id,{name:c.name,kind:c.kind,price:null,qty:c.qty,unit:c.unit,gPerPiece:c.gpp,icon:c.icon,catalogId:c.id,updatedAt:new Date().toISOString()});
  return id;
}
function resolveKey(key){return key.startsWith("i:")?key.slice(2):createFromCatalog(CAT_BY_ID[key.slice(2)])}
function addLines(ids,kind){
  const r=S.draft;if(!r||!ids.length)return;
  const arr=kind==="fourniture"?r.pack:r.lines;
  const first=[];
  ids.forEach(id=>{
    const ing=S.ings[id];
    const l=kind==="fourniture"?{id:uid(),ingId:id,qty:1}:{id:uid(),ingId:id,qty:null,unit:defaultUnit(ing)};
    arr.push(l);first.push(l.id);
  });
  saveDraftSoon();render();
  if(kind!=="fourniture")setTimeout(()=>{const q=document.getElementById("q-"+first[0]);if(q){q.scrollIntoView({block:"center",behavior:reduceMotion?"auto":"smooth"});q.focus({preventScroll:true})}},80);
}
function assignLine(lineId,kind,ingId){
  const r=S.draft;if(!r)return;
  const arr=kind==="fourniture"?r.pack:r.lines;
  const l=arr.find(x=>x.id===lineId);if(!l)return;
  l.ingId=ingId;
  if(kind!=="fourniture"){const ing=S.ings[ingId];if(!l.unit||(ing&&toBase(1,l.unit,ing).err))l.unit=defaultUnit(ing)}
  saveDraftSoon();render();
}

function recipeMenu(){
  openSheet(`<h2>${esc(S.draft.name||"Recette")}</h2>
    <div class="menu-list">
      <button class="btn ghost block" data-act="dup">Dupliquer la recette</button>
      <div id="del-zone"><button class="btn danger block" data-act="del-recipe">Supprimer la recette</button></div>
    </div>`,{type:"menu"});
}
function scaleSheet(){
  const p=num(S.draft.portions);
  openSheet(`<h2>Adapter les quantités</h2>
    <p class="hint">Les quantités d'ingrédients sont multipliées. Le temps et les emballages ne changent pas : ajuste-les à la main si besoin.</p>
    <div class="grid2">
      <label class="field" for="sc-from"><span>Recette actuelle</span><div class="suffix"><input id="sc-from" inputmode="decimal" value="${esc(fnum(p))}" placeholder="12"><i>parts</i></div></label>
      <label class="field" for="sc-to"><span>Nouvelle taille</span><div class="suffix"><input id="sc-to" inputmode="decimal" placeholder="20" autofocus><i>parts</i></div></label>
    </div>
    <div class="calc-out num" id="sc-out"><span>Multiplicateur</span>—</div>
    <div class="sheet-actions"><button class="btn ghost" data-act="close-sheet">Annuler</button><button class="btn primary" data-act="scale-go">Adapter</button></div>`,{type:"scale"});
}
function exportSheet(){
  const data=JSON.stringify({app:"calculateur-patisserie",v:1,date:today(),ingredients:S.ings,recipes:S.recipes,settings:S.settings});
  openSheet(`<h2>Sauvegarde</h2>
    <p class="hint">Copie ce texte et garde-le dans tes notes ou envoie-le toi par message. Il contient toutes tes recettes et tes prix.</p>
    <textarea class="mono" id="exp-text" readonly>${esc(data)}</textarea>
    <button class="btn primary block" data-act="copy-export">${I.copy} Copier la sauvegarde</button>`,{type:"export"});
}
function importSheet(){
  openSheet(`<h2>Restaurer une sauvegarde</h2>
    <p class="hint">Colle le texte d'une sauvegarde. Les recettes et ingrédients qu'il contient sont ajoutés ; ceux qui existent déjà sont remplacés par la version de la sauvegarde.</p>
    <textarea class="mono" id="imp-text" placeholder="Colle ici…"></textarea>
    <div class="sheet-actions"><button class="btn ghost" data-act="close-sheet">Annuler</button><button class="btn primary" data-act="import-go">Restaurer</button></div>`,{type:"import"});
}

/* ---------- actions ---------- */
function openRecipe(id){
  const r=S.recipes[id];if(!r)return;
  S.openId=id;S.draft=clone(r);S.draft.lines=S.draft.lines||[];S.draft.pack=S.draft.pack||[];
  S.view="recipe";S.tab="compo";render();window.scrollTo(0,0);
}
function leaveRecipe(){commitDraft();S.draft=null;S.openId=null;S.view="recipes";render();window.scrollTo(0,0)}
function newRecipe(){
  const id=uid();
  const r={name:"",category:"",portions:null,lines:[],pack:[],laborMin:null,ovenMin:null,pricing:{mode:"profit",value:null},friendPrice:null,notes:"",createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
  putRecipe(id,r);openRecipe(id);
  setTimeout(()=>{const n=$("#r-name");if(n)n.focus()},60);
}
function copyText(text,okMsg,fallbackEl){
  const done=()=>toast(okMsg);
  try{
    navigator.clipboard.writeText(text).then(done,()=>{if(fallbackEl){fallbackEl.focus();fallbackEl.select()}toast("Copie bloquée : le texte est sélectionné, copie-le à la main.")});
  }catch(e){if(fallbackEl){fallbackEl.focus();fallbackEl.select()}toast("Copie bloquée : sélectionne le texte à la main.")}
}
let toastT=null;
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2600)}

document.addEventListener("click",e=>{
  const a=e.target.closest("[data-act]");if(!a)return;
  const act=a.dataset.act;
  switch(act){
    case "nav":if(S.view==="recipe")commitDraft();S.draft=null;S.openId=null;S.view=a.dataset.view;saveUi();render();window.scrollTo(0,0);break;
    case "new-recipe":newRecipe();break;
    case "open":openRecipe(a.dataset.id);break;
    case "back":leaveRecipe();break;
    case "tab":S.tab=a.dataset.tab;commitDraft();render();window.scrollTo(0,0);break;
    case "ingkind":S.ingKind=a.dataset.kind;saveUi();render();break;
    case "new-ing":pickSheet({mode:"ings",kind:S.ingKind});break;
    case "todo":S.ingTodo=!S.ingTodo;render();break;
    case "fix-price":ingSheet(a.dataset.id);break;
    case "edit-ing":ingSheet(a.dataset.id);break;
    case "ing-kind":sheetCtx.kind=a.dataset.kind;a.parentNode.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===a));if(a.dataset.kind==="fourniture")$("#ing-unit").value="pce";updIngOut();break;
    case "ing-save":saveIng();break;
    case "ing-del":{
      const c=sheetCtx;
      $("#ing-confirm").innerHTML=`<div class="banner bad" style="flex-direction:column;gap:10px">Supprimer « ${esc(S.ings[c.id].name)} » ?${c.used?` Il est utilisé dans ${c.used} recette${c.used>1?"s":""}, qui afficheront « ingrédient supprimé ».`:""}<button class="btn danger block" data-act="ing-del-yes" style="background:var(--bad);color:var(--paper)">Oui, supprimer</button></div>`;
      break;}
    case "ing-del-yes":delIng(sheetCtx.id);closeSheet();toast("Supprimé");render();break;
    case "close-sheet":closeSheet();break;
    case "add-line":pickSheet({mode:"recipe",kind:a.dataset.kind});break;
    case "rm-line":{
      const pack=a.dataset.pack==="1",arr=pack?S.draft.pack:S.draft.lines;
      const i=arr.findIndex(x=>x.id===a.dataset.line);if(i>=0)arr.splice(i,1);
      saveDraftSoon();render();break;}
    case "pick":pickSheet({mode:"replace",kind:a.dataset.kind,lineId:a.dataset.line});break;
    case "pk-cat":{const sc=$("#pk-scroll"),sec=document.getElementById("pks-"+a.dataset.sec);if(sc&&sec)sc.scrollTo({top:sec.offsetTop,behavior:reduceMotion?"auto":"smooth"});break;}
    case "pk-tap":{
      const c=sheetCtx,key=a.dataset.key;
      if(c.mode==="replace"){const id=resolveKey(key);closeSheet();assignLine(c.lineId,c.kind,id);break}
      if(c.mode==="ings"&&key.startsWith("i:")){closeSheet();ingSheet(key.slice(2));break}
      if(c.sel.has(key))c.sel.delete(key);else c.sel.add(key);
      a.setAttribute("aria-pressed",c.sel.has(key));updPickFoot();break;}
    case "pk-add":{
      const c=sheetCtx,ids=[...c.sel].map(resolveKey),n=ids.length;
      const noPrice=ids.filter(id=>unitPrice(S.ings[id])==null).length;
      closeSheet();
      if(c.mode==="recipe")addLines(ids,c.kind);else{S.ingKind=c.kind;render()}
      toast(`${n} ajouté${n>1?"s":""}`+(noPrice?` · pense à mettre ${noPrice>1?"leurs prix":"son prix"}`:""));
      break;}
    case "pk-create":{
      const c=sheetCtx,name=$("#pick-q").value.trim();
      const after=c.mode==="recipe"?id=>addLines([id],c.kind):c.mode==="replace"?id=>assignLine(c.lineId,c.kind,id):null;
      ingSheet(null,{name,kind:c.kind,unit:c.kind==="fourniture"?"pce":"kg",_after:after});
      break;}
    case "pmode":S.draft.pricing=S.draft.pricing||{};S.draft.pricing.mode=a.dataset.mode;saveDraftSoon();render();break;
    case "recipe-menu":recipeMenu();break;
    case "dup":{
      commitDraft();
      const id=uid(),r=clone(S.draft);r.name=(r.name||"Recette")+" (copie)";r.createdAt=r.updatedAt=new Date().toISOString();
      r.lines=r.lines.map(l=>({...l,id:uid()}));r.pack=r.pack.map(l=>({...l,id:uid()}));
      putRecipe(id,r);closeSheet();openRecipe(id);toast("Recette dupliquée");break;}
    case "del-recipe":
      $("#del-zone").innerHTML=`<div class="banner bad" style="flex-direction:column;gap:10px">Supprimer définitivement cette recette ?<button class="btn danger block" data-act="del-recipe-yes" style="background:var(--bad);color:var(--paper)">Oui, supprimer</button></div>`;break;
    case "del-recipe-yes":{
      clearTimeout(draftTimer);draftTimer=null;const id=S.openId;S.draft=null;S.openId=null;delRecipe(id);closeSheet();S.view="recipes";render();toast("Recette supprimée");break;}
    case "scale":scaleSheet();break;
    case "scale-go":{
      const from=num($("#sc-from").value),to=num($("#sc-to").value);
      if(!(from>0&&to>0)){toast("Indique les deux nombres de parts.");return}
      const k=to/from;
      S.draft.lines.forEach(l=>{const q=num(l.qty);if(q!=null)l.qty=Math.round(q*k*100)/100});
      S.draft.portions=to;closeSheet();saveDraftSoon();render();toast(`Quantités × ${nf.format(Math.round(k*100)/100)}`);break;}
    case "copy-quote":{
      const r=S.draft,c=compute(r);
      const txt=`${r.name||"Création"}${c.portions?` (${fnum(c.portions)} parts)`:""}\nPrix : ${moneyR(c.price)}${c.perPart?`, soit ${money(c.perPart)} la part`:""}`;
      copyText(txt,"Prix copié, prêt à envoyer");break;}
    case "export":exportSheet();break;
    case "copy-export":copyText($("#exp-text").value,"Sauvegarde copiée",$("#exp-text"));break;
    case "import":importSheet();break;
    case "import-go":{
      let d;try{d=JSON.parse($("#imp-text").value)}catch(err){toast("Ce texte n'est pas une sauvegarde valide.");return}
      if(!d||typeof d!=="object"||(!d.ingredients&&!d.recipes)){toast("Ce texte n'est pas une sauvegarde de l'app.");return}
      let n=0;
      Object.entries(d.ingredients||{}).forEach(([id,v])=>{if(v&&v.name){putIng(id,v);n++}});
      Object.entries(d.recipes||{}).forEach(([id,v])=>{if(v&&typeof v==="object"){putRecipe(id,v);n++}});
      if(d.settings){S.settings={...DEFAULTS,...d.settings};setDoc("settings/main",clone(S.settings))}
      saveLocal();saveCache();closeSheet();render();toast(`${n} éléments restaurés`);break;}
  }
});

document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){S.q=t.value;$("#recipeList").innerHTML=recipeItems();return}
  if(t.id==="iq"){S.iq=t.value;$("#ingList").innerHTML=ingItems();return}
  if(t.id==="pick-q"){renderPick();$("#pk-scroll").scrollTop=0;return}
  if(t.closest("#sheetBody")&&sheetCtx&&sheetCtx.type==="ing"){updIngOut();return}
  if(t.closest("#sheetBody")&&sheetCtx&&sheetCtx.type==="scale"){
    const from=num($("#sc-from").value),to=num($("#sc-to").value);
    $("#sc-out").innerHTML=`<span>Multiplicateur</span>${from>0&&to>0?"× "+nf.format(Math.round(to/from*100)/100):"—"}`;return}
  if(t.dataset.set){
    const k=t.dataset.set;S.settings[k]=k==="rounding"?Number(t.value):num(t.value);
    if(S.mode==="local")saveLocal();saveSettingsSoon();return}
  const f=t.dataset.f;if(!f||!S.draft)return;
  const r=S.draft;
  if(t.dataset.line){
    const arr=t.dataset.pack==="1"?r.pack:r.lines;const l=arr.find(x=>x.id===t.dataset.line);if(!l)return;
    if(f==="qty")l.qty=num(t.value);else if(f==="unit")l.unit=t.value;
  }else if(f==="name"||f==="category"||f==="notes")r[f]=t.value;
  else if(f==="portions")r.portions=num(t.value);
  else if(f==="friendPrice")r.friendPrice=num(t.value);
  else if(f==="pval"){r.pricing=r.pricing||{mode:"profit"};r.pricing.value=num(t.value)}
  else if(f==="laborH"||f==="laborM"){const h=num($("#r-lh").value)||0,m=num($("#r-lm").value)||0;r.laborMin=h*60+m||null}
  else if(f==="ovenH"||f==="ovenM"){const h=num($("#r-oh").value)||0,m=num($("#r-om").value)||0;r.ovenMin=h*60+m||null}
  saveDraftSoon();updateComputed();
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="ing-unit"){updIngOut();return}
  if(t.dataset.set==="rounding"){S.settings.rounding=Number(t.value);if(S.mode==="local")saveLocal();saveSettingsSoon()}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!$("#sheet").hidden)closeSheet();
  if(e.key==="Enter"&&sheetCtx&&sheetCtx.type==="ing"&&e.target.tagName==="INPUT"){e.preventDefault();saveIng()}
  if(e.key==="Enter"&&sheetCtx&&sheetCtx.type==="pick"&&e.target.id==="pick-q"){e.preventDefault();e.target.blur()}
});
window.addEventListener("pagehide",()=>{commitDraft()});
document.addEventListener("visibilitychange",()=>{if(document.hidden)commitDraft()});
})();
</script>

<script>
if("serviceWorker" in navigator&&location.protocol==="https:"){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
